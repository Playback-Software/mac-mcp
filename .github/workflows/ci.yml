name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub-hosted Apple silicon runner with macOS 26 and Xcode 26 (the image's default Xcode).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      # Integration tests drive the installed agent and TestHost in a GUI session, so they are not run here.
      # Serially: hosted runners have few cores, and some unit tests bound how long a cancellation may take.
      - name: Unit tests
        run: swift test --skip IntegrationTests --no-parallel

      - name: Lint
        run: scripts/lint-blocking.sh
